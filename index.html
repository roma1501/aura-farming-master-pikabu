<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мастер ауры</title>
    <link rel="icon" type="image/png" href="assets/ui/favicon.png">
    <style>
        @font-face { font-family: 'GameFont'; src: url('assets/fonts/rubik.ttf?v=1.0.0') format('truetype'); font-weight: 300 900; font-display: swap; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        /* ПК: окно шире 2:1 — поле игры 2:1 по центру, по бокам рамка. transform делает body
           контейнером для position:fixed (HUD, канвас); координаты — через VIEW (Constants.js). */
        @media (min-aspect-ratio: 2/1) and (hover: hover) and (pointer: fine) {
            html { background: #07030f; }
            body { position: relative; width: 200vh; margin: 0 auto; transform: translateZ(0); }
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Загрузка Aura Farming Master: закат над неоновым городом (только CSS, без JS) — градиент неба, солнце,
           три ряда крыш с горящими окнами, неоновая вывеска с названием, полоска ауры.
           DOM-контракт LoadingScreen.js: #loading-screen, #loading-title, #loading-meter,
           .loading-progress, #loading-percent, .loading-text, #loading-retry. */
        #loading-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: clamp(10px, 2.6vh, 24px); padding: 0 16px; box-sizing: border-box; overflow: hidden; z-index: 1000;
            background: linear-gradient(180deg, #160a3a 0%, #4b1469 34%, #b8387c 62%, #ff8a4a 86%, #ffc070 100%);
            font-family: GameFont, system-ui, sans-serif;
        }
        #loading-screen > :not(.ls-sky) { position: relative; }
        .ls-sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .ls-sky i { position: absolute; display: block; }
        .ls-sun { left: 50%; bottom: 20%; width: min(60vw, 360px); aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%;
            background: linear-gradient(180deg, #fff1a0 0%, #ff9a4a 55%, #ff3fa8 100%);
            -webkit-mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 18px); mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 18px);
            filter: drop-shadow(0 0 40px rgba(255, 90, 160, .7)); }
        .ls-star { left: var(--x); top: var(--y); width: var(--s, 3px); aspect-ratio: 1; background: #fff; border-radius: 50%; animation: ls-twinkle 2.4s ease-in-out var(--o, 0s) infinite; }
        .ls-row { left: -5%; right: -5%; bottom: var(--b); height: var(--h); background-color: var(--c);
            clip-path: polygon(0 100%, 0 40%, 4% 40%, 4% 18%, 9% 18%, 9% 55%, 14% 55%, 14% 8%, 19% 8%, 19% 45%, 25% 45%, 25% 25%, 31% 25%, 31% 60%, 37% 60%, 37% 12%, 43% 12%, 43% 38%, 50% 38%, 50% 20%, 56% 20%, 56% 52%, 62% 52%, 62% 6%, 68% 6%, 68% 42%, 74% 42%, 74% 22%, 80% 22%, 80% 58%, 86% 58%, 86% 14%, 92% 14%, 92% 36%, 100% 36%, 100% 100%); }
        .ls-row::after { content: ''; position: absolute; inset: 0; opacity: var(--w, .8);
            background: radial-gradient(circle, var(--l1) 0 1.6px, transparent 2px) 0 0 / 22px 26px, radial-gradient(circle, var(--l2) 0 1.6px, transparent 2px) 11px 13px / 22px 26px; }
        .ls-neon { left: var(--x); bottom: var(--b); width: var(--w); height: 5px; border-radius: 3px; background: var(--c); box-shadow: 0 0 12px var(--c), 0 0 26px var(--c); animation: ls-flick 3.2s steps(1) var(--o, 0s) infinite; }
        .ls-logo { text-align: center; font: 900 clamp(34px, 11vw, 92px)/.92 GameFont, system-ui, sans-serif; letter-spacing: .02em; color: #fff7f0; text-transform: uppercase; font-style: italic;
            text-shadow: 0 0 6px #fff, 0 0 18px #ff3fa8, 0 0 38px #ff3fa8, 4px 4px 0 #6a1a8a; animation: ls-pop .7s cubic-bezier(.2, 1.5, .4, 1) both; }
        .ls-logo small { display: block; margin-top: .25em; font-size: .34em; letter-spacing: .5em; color: #3fe8ff; text-shadow: 0 0 10px #3fe8ff; font-style: normal; }
        #loading-title { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .ls-meter { width: min(440px, 76vw); animation: ls-up .6s ease-out .15s both; }
        .loading-bar { width: 100%; height: 26px; box-sizing: border-box; padding: 4px; background: rgba(10, 4, 28, .75); border: 3px solid #3fe8ff; border-radius: 4px;
            box-shadow: 0 0 14px rgba(63, 232, 255, .6), inset 0 0 8px rgba(63, 232, 255, .3); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); }
        .loading-progress { position: relative; height: 100%; width: 0%; min-width: 10px; border-radius: 2px; transition: width 0.3s ease;
            background: linear-gradient(-45deg, rgba(255, 255, 255, .28) 25%, transparent 25% 50%, rgba(255, 255, 255, .28) 50% 75%, transparent 75%) 0 0 / 22px 22px, linear-gradient(90deg, #ff3fa8, #ffb03a);
            box-shadow: 0 0 12px #ff3fa8; animation: ls-stripes .8s linear infinite; }
        #loading-percent { margin-bottom: 8px; text-align: center; font: 900 clamp(18px, 3vh, 26px)/1 GameFont, system-ui, sans-serif; color: #fff; letter-spacing: 3px; text-shadow: 0 0 10px #3fe8ff; }
        .loading-text { min-height: 1.2em; text-align: center; color: #ffe9f5; font: 700 clamp(14px, 2.2vh, 18px)/1.2 GameFont, system-ui, sans-serif; letter-spacing: 1px; text-shadow: 0 0 8px #000; }
        #loading-retry { padding: 12px 34px; border: 3px solid #ff3fa8; border-radius: 4px; cursor: pointer; background: #1d0b3d; color: #fff; font: 900 22px/1 GameFont, system-ui, sans-serif; box-shadow: 0 0 16px #ff3fa8; }
        #loading-retry:active { transform: translateY(2px); }
        @keyframes ls-twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
        @keyframes ls-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes ls-up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes ls-stripes { to { background-position: 22px 0, 0 0; } }
        @keyframes ls-flick { 0%, 92%, 100% { opacity: 1; } 94%, 98% { opacity: .2; } }
        @media (max-height: 430px) {
            #loading-screen { gap: 6px; }
            .ls-logo { font-size: clamp(26px, 9vh, 56px); }
            .loading-bar { height: 22px; }
            #loading-percent { font-size: 16px; margin-bottom: 4px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #loading-screen *, #loading-screen *::after { animation: none !important; }
        }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <div class="ls-sky" aria-hidden="true">
            <i class="ls-star" style="--x: 12%; --y: 8%; --s: 3px"></i>
            <i class="ls-star" style="--x: 30%; --y: 16%; --s: 2px; --o: -.8s"></i>
            <i class="ls-star" style="--x: 64%; --y: 9%; --s: 3px; --o: -1.4s"></i>
            <i class="ls-star" style="--x: 82%; --y: 20%; --s: 2px; --o: -.4s"></i>
            <i class="ls-star" style="--x: 48%; --y: 5%; --s: 2px; --o: -2s"></i>
            <i class="ls-sun"></i>
            <i class="ls-row" style="--b: 17%; --h: 24%; --c: #4a1a6e; --w: .55; --l1: #ff9ad0; --l2: #ffd27a"></i>
            <i class="ls-row" style="--b: 8%; --h: 24%; --c: #2a0f4a; --w: .75; --l1: #3fe8ff; --l2: #ff3fa8"></i>
            <i class="ls-row" style="--b: -2%; --h: 22%; --c: #10051f; --w: .9; --l1: #ffe14d; --l2: #3fe8ff"></i>
            <i class="ls-neon" style="--x: 8%; --b: 22%; --w: 70px; --c: #ff3fa8"></i>
            <i class="ls-neon" style="--x: 72%; --b: 30%; --w: 54px; --c: #3fe8ff; --o: -1s"></i>
            <i class="ls-neon" style="--x: 40%; --b: 14%; --w: 80px; --c: #ffe14d; --o: -2s"></i>
        </div>
        <div class="ls-logo" aria-hidden="true">Мастер<br>ауры<small>НЕОНОВЫЕ КРЫШИ</small></div>
        <h1 id="loading-title">Мастер ауры</h1>
        <div class="ls-meter">
            <div id="loading-percent">0%</div>
            <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        </div>
        <div class="loading-text" data-t="loading"></div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <!-- Порядок значим: Constants.js первым (остальные читают его глобалы), main.js последним -->
    <script src="https://games.pikabu.ru/sdk/sdk.js"></script>
<script src="js/Constants.js?v=1.0.0"></script>
    <script src="libs/simplex-noise.js?v=1.0.0"></script>
    <script src="libs/babylon.js?v=1.0.0"></script>
    <script src="js/Maps.js?v=1.0.0"></script>
    <script src="js/Maps2D.js?v=1.0.0"></script>
    <script src="js/World2D.js?v=1.0.0"></script>
    <script src="js/World3D.js?v=1.0.0"></script>
    <script src="js/Terrain3D.js?v=1.0.0"></script>
    <script src="js/CameraControl.js?v=1.0.0"></script>
    <script src="js/Model3D.js?v=1.0.0"></script>
    <script src="js/ModelFBX.js?v=1.0.0"></script>
    <script src="js/ModelOBJ.js?v=1.0.0"></script>
    <script src="js/ModelGLTF.js?v=1.0.0"></script>
    <script src="js/Location3D.js?v=1.0.0"></script>
    <script src="js/Pause.js?v=1.0.0"></script>
    <script src="js/Sound.js?v=1.0.0"></script>
    <script src="js/Lang.js?v=1.0.0"></script>
    <script src="js/Platform.js?v=1.0.0"></script>
    <script src="js/PlatformPikabu.js?v=1.0.0"></script>
    <script src="js/LoadingScreen.js?v=1.0.0"></script>
    <script src="js/ParticleFX.js?v=1.0.0"></script>
    <!-- Скрипты игры (js/Game.js и её модули) — здесь, до main.js -->
    <script src="js/GameCosmeticsData.js?v=1.0.0"></script>
    <script src="js/GameWorld.js?v=1.0.0"></script>
    <script src="js/GameCharacter.js?v=1.0.0"></script>
    <script src="js/GameInput.js?v=1.0.0"></script>
    <script src="js/GameCamera.js?v=1.0.0"></script>

    <script src="js/GameFX.js?v=1.0.0"></script>

    <script src="js/GameWardrobe.js?v=1.0.0"></script>

    <script src="js/GameTelemetry.js?v=1.0.0"></script>
    <script src="js/GameSkin.js?v=1.0.0"></script>
    <script src="js/Game.js?v=1.0.0"></script>
    <script src="js/main.js?v=1.0.0"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
</body>
</html>
